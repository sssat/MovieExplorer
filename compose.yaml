name: movieexplorer

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: movieexplorer-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}"
    ports:
      - "14330:1433"
    volumes:
      - movieexplorer_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  movieexplorer_sql_data:
